<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Autentificare - CINEPLEX</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #080808,
            #1a0004,
            #080808
        );

    color: white;

    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* CUTIA LOGIN */

.login-box {
    width: 100%;
    max-width: 420px;

    background: #151515;

    padding: 35px;

    border-radius: 15px;

    border: 1px solid #292929;

    box-shadow:
        0 0 30px rgba(229, 9, 20, 0.25);
}

/* LOGO */

.logo {
    text-align: center;

    font-size: 38px;

    font-weight: 900;

    letter-spacing: -2px;

    margin-bottom: 10px;
}

.logo span {
    color: #e50914;
}

/* TITLU */

h2 {
    text-align: center;

    margin-bottom: 30px;

    font-size: 25px;
}

/* LABEL */

label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;
}

/* INPUT */

input {
    width: 100%;

    padding: 14px;

    margin-bottom: 18px;

    background: #222;

    color: white;

    border: 1px solid #333;

    border-radius: 8px;

    font-size: 16px;

    outline: none;
}

input:focus {
    border-color: #e50914;
}

/* BUTON */

.login-button {
    width: 100%;

    padding: 14px;

    background: #e50914;

    color: white;

    border: none;

    border-radius: 8px;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

.login-button:hover {
    background: #b20710;
}

/* MESAJ */

.message {
    min-height: 25px;

    text-align: center;

    margin-top: 15px;

    color: #ffb3bd;

    line-height: 1.4;
}

/* LINKURI */

.links {
    text-align: center;

    margin-top: 25px;

    line-height: 2;
}

.links a {
    color: #ffb3bd;

    text-decoration: none;
}

.links a:hover {
    color: white;
}

.back {
    color: #999 !important;
}

/* TELEFON */

@media (max-width: 500px) {

    .login-box {
        padding: 25px;
    }

    .logo {
        font-size: 30px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        CINE<span>PLEX</span>
    </div>

    <h2>
        Autentificare
    </h2>


    <!-- FORMULAR LOGIN -->

    <form id="loginForm">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="Introdu e-mailul"
            required
        >


        <label for="password">
            Parolă
        </label>

        <input
            type="password"
            id="password"
            placeholder="Introdu parola"
            required
        >


        <button
            type="submit"
            class="login-button"
        >
            🔐 Autentificare
        </button>

    </form>


    <!-- MESAJ -->

    <div
        id="message"
        class="message">
    </div>


    <!-- LINKURI -->

    <div class="links">

        <div>
            Nu ai cont?
            <a href="register.html">
                Creează cont
            </a>
        </div>

        <div>
            <a
                href="#"
                id="forgotPassword">
                Am uitat parola
            </a>
        </div>

        <div>
            <a
                href="index.html"
                class="back">
                ← Înapoi la CINEPLEX
            </a>
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword,
    sendPasswordResetEmail
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/*
==================================================
CONFIGURAȚIA FIREBASE
==================================================

AICI TREBUIE SĂ PUI DATELE PROIECTULUI TĂU FIREBASE.

NU LĂSA "PUNE_AICI".

==================================================
*/

const firebaseConfig = {

    apiKey:
        "PUNE_AICI_API_KEY",

    authDomain:
        "PUNE_AICI_AUTH_DOMAIN",

    projectId:
        "PUNE_AICI_PROJECT_ID",

    storageBucket:
        "PUNE_AICI_STORAGE_BUCKET",

    messagingSenderId:
        "PUNE_AICI_MESSAGING_SENDER_ID",

    appId:
        "PUNE_AICI_APP_ID"

};


/* PORNEȘTE FIREBASE */

const app =
    initializeApp(firebaseConfig);


/* PORNEȘTE AUTENTIFICAREA */

const auth =
    getAuth(app);


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const message =
            document
            .getElementById("message");


        message.textContent =
            "Se verifică...";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            message.textContent =
                "✅ Autentificare reușită!";


            setTimeout(
                function() {

                    window.location.href =
                        "account.html";

                },
                700
            );


        }

        catch (error) {

            console.error(error);


            if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message.textContent =
                    "❌ E-mailul sau parola sunt greșite.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "❌ Adresa de e-mail nu este validă.";

            }

            else {

                message.textContent =
                    "❌ A apărut o eroare. Încearcă din nou.";

            }

        }

    }
);


/* RESETARE PAROLĂ */

document
.getElementById("forgotPassword")
.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const message =
            document
            .getElementById("message");


        if (!email) {

            message.textContent =
                "Scrie mai întâi adresa de e-mail.";

            return;

        }


        message.textContent =
            "Se trimite e-mailul...";


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            message.textContent =
                "✅ Verifică e-mailul pentru resetarea parolei.";

        }

        catch (error) {

            console.error(error);


            message.textContent =
                "❌ Nu am putut trimite e-mailul.";

        }

    }
);

</script>

</body>
</html>
